[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ottasa"
version = "0.1.0"
description = "Run opensource Text-to-Speech model with one command"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
ottasa = "ottasa.cli:app"